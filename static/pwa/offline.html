<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6b26d9"><meta name="robots" content="noindex">
<title>Offline — Keystone</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eef0f4;color:#1b2234;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
main{max-width:27rem}
.art{width:min(230px,66vw);height:auto;overflow:visible;margin-bottom:6px}
.arch{fill:none;stroke:#6b26d9;stroke-width:14}
.key{fill:#0bb8da;animation:f 3.2s ease-in-out infinite;transform-origin:110px 30px}
.sh{fill:rgba(61,22,144,.12)}
.wave{fill:none;stroke:#c9b8f3;stroke-width:5;stroke-linecap:round}
.x{stroke:#eb4799;stroke-width:6;stroke-linecap:round}
h1{margin:6px 0 8px;font-size:1.65rem;font-weight:800;letter-spacing:-.02em}
p{margin:0;color:#4a5268;line-height:1.6}
.card{margin:18px 0 0;padding:14px 16px;border-radius:16px;background:#f4effd;color:#3d1690;font-size:.9rem;line-height:1.5}
a.b{display:inline-block;margin-top:22px;height:44px;line-height:44px;padding:0 24px;border-radius:12px;background:#6b26d9;color:#fff;text-decoration:none;font-weight:700;transition:background-color .15s,transform .15s}
a.b:hover{background:#5a1fb8}a.b:active{transform:scale(.97)}
a.b:focus-visible{outline:3px solid rgba(107,38,217,.55);outline-offset:3px}
@keyframes f{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-9px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.key{animation:none}}
</style></head>
<body><main>
<svg class="art" viewBox="0 0 220 150" role="img" aria-label="Keystone arch with no connection"><ellipse class="sh" cx="110" cy="136" rx="62" ry="7"/><path class="arch" d="M62 128V74a48 48 0 0 1 96 0v54"/><path class="key" d="M92 14h36l10 30H82z"/><path class="wave" d="M86 96q12-12 24 0t24 0"/><path class="x" d="M101 106l18 14M119 106l-18 14"/></svg>
<h1>You are offline</h1>
<p>Keystone needs a connection to open tests and notes. Pages you opened before may still work.</p>
<p class="card">Your saved progress is safe on this device. It syncs when you are back online.</p>
<a class="b" href="/">Try again</a>
</main>
<script src="/static/js/ks-offline.js"></script>
</body></html>
