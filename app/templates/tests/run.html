{% extends "base.html" %}
{% block title %}{{ spec.title }} — {{ app_name }}{% endblock %}
{% block head %}<link rel="stylesheet" href="{{ static_v('css/folder.css') }}">{% endblock %}
{% block content %}
<div class="ftp-root">
  <div class="ftp-wrap ftp-sheets">
    <section class="ftp-sheet ks-page ks-run">
      <noscript><p class="ks-alert">This test needs JavaScript to run the timer and save your answers.</p></noscript>
      <div id="runner" class="ks-skin" data-minutes="{{ spec.minutes }}">
        <p class="ks-p ks-loading"><i></i><i></i><i></i><span>Loading test…</span></p>
      </div>
      <script type="application/json" id="test-data">{{ payload|tojson }}</script>
    </section>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ static_v('js/test-runner.js') }}" defer></script>{% endblock %}
